[package]
name = "follang-gerc"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["Trim Bresilla"]
description = "Rust lowering and emission layer in the PARC/LINC/GERC pipeline — generates Rust FFI bindings from C analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fol-lang/gerc"
homepage = "https://github.com/fol-lang/gerc"
documentation = "https://fol-lang.github.io/gerc/"
readme = "README.md"
publish = false
keywords = ["c", "ffi", "bindings", "codegen"]
categories = ["development-tools::ffi", "code-generation"]
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/native-fixtures/**",
    "/tests/pipeline-fixtures/**",
    "/Cargo.toml",
    "/LICENSE-*",
    "/README.md",
    "/RELEASE.md",
]

[lib]
name = "gerc"

[dependencies]
blake3 = "1"
linc = { package = "follang-linc", version = "=0.1.0", git = "https://github.com/fol-lang/linc", rev = "f3a2b30b021058264be975a7079af80455e0d1be", default-features = false, features = ["contracts"] }
parc = { package = "follang-parc", version = "=0.16.0", git = "https://github.com/fol-lang/parc", rev = "bb8c9643f278957574f830b6b0f612058d2694fb" }
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
thiserror = "2"

[features]
pipeline-native = ["linc/native-inspection"]
